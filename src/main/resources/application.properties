# ----------------- SMTP Email Configuration -----------------
# Mock mode: set to mock@example.com to bypass real email sending (local dev)
# For production: replace with real Gmail + App Password
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=mock@example.com
spring.mail.password=mock
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

