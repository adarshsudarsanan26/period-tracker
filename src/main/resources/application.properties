# App Configuration (LOCAL DEV profile)
# Production config: application-prod.properties (activated by SPRING_PROFILES_ACTIVE=prod)
spring.application.name=tracker
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# Base URL for password reset links
app.base.url=http://localhost:8080

# ----------------- H2 Configuration (Default) -----------------
spring.datasource.url=jdbc:h2:file:./db/period_tracker;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Hibernate settings
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

# Enable initial SQL scripts
spring.sql.init.mode=always

