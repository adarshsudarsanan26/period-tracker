<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LunaFlow - Reset Password</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="dark-mode">

    <!-- Password Reset Overlay Container (Matches Login screen) -->
    <div class="auth-overlay">
        <div class="auth-card glass-card">
            <div class="auth-header">
                <div class="logo-icon"><i class="fa-solid fa-key"></i></div>
                <h2>LunaFlow</h2>
                <p id="auth-subtitle">Choose a new secure password</p>
            </div>
            
            <form id="reset-password-form">
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" class="form-control" placeholder="Minimum 6 characters" required autocomplete="new-password">
                </div>
                <div class="form-group mt-15">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" class="form-control" placeholder="Confirm your new password" required autocomplete="new-password">
                </div>
                <div class="auth-error-msg" id="reset-error"></div>
                <div class="auth-success-msg" id="reset-success" style="color: var(--normal-color); font-size: 13.5px; margin-top: 10px; text-align: left; font-weight: 500;"></div>
                <button type="submit" class="primary-btn mt-20 w-100" id="reset-submit-btn">Update Password</button>
                <p class="auth-toggle-text mt-15"><a href="index.html">Back to Sign In</a></p>
            </form>
        </div>
    </div>

    <footer class="site-footer">
        <p>&copy; 2026 LunaFlow &nbsp;&bull;&nbsp; Developed by <strong>Adarsh Sudarsanan</strong> &nbsp;&bull;&nbsp; <a href="mailto:adarshaadhi2255@gmail.com">adarshaadhi2255@gmail.com</a></p>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const API_BASE = (window.location.protocol === 'file:' || window.location.port !== '8080')
                ? 'http://localhost:8080/api'
                : '/api';

            // Extract token from query parameters
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const errorDiv = document.getElementById('reset-error');
            const successDiv = document.getElementById('reset-success');
            const submitBtn = document.getElementById('reset-submit-btn');
            const form = document.getElementById('reset-password-form');

            if (!token || token.trim() === '') {
                errorDiv.innerText = 'Invalid, missing, or expired reset token. Please request a new link.';
                submitBtn.disabled = true;
                return;
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorDiv.innerText = '';
                successDiv.innerText = '';

                const newPasswordVal = document.getElementById('new-password').value;
                const confirmPasswordVal = document.getElementById('confirm-password').value;

                if (newPasswordVal.length < 6) {
                    errorDiv.innerText = 'Password must be at least 6 characters.';
                    return;
                }

                if (newPasswordVal !== confirmPasswordVal) {
                    errorDiv.innerText = 'Passwords do not match.';
                    return;
                }

                const originalBtnText = submitBtn.innerHTML;
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-5"></i> Updating...';

                try {
                    const response = await fetch(`${API_BASE}/auth/reset-password`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        credentials: 'include',
                        body: JSON.stringify({
                            token: token.trim(),
                            newPassword: newPasswordVal
                        })
                    });

                    if (!response.ok) {
                        let errMsg = 'Password reset failed.';
                        try {
                            const errData = await response.json();
                            if (errData && errData.message) errMsg = errData.message;
                        } catch (e2) {
                            try {
                                const text = await response.text();
                                if (text) errMsg = text;
                            } catch (e3) {}
                        }
                        throw new Error(errMsg);
                    }

                    successDiv.innerText = 'Password updated successfully! Redirecting to login...';
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2500);

                } catch (err) {
                    console.error(err);
                    errorDiv.innerText = err.message || 'Failed to reset password. The link may have expired.';
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalBtnText;
                }
            });
        });
    </script>
</body>
</html>
