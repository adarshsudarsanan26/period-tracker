# ================================================================
# LunaFlow — PRODUCTION Profile (Railway deployment)
# Activated by: SPRING_PROFILES_ACTIVE=prod
# All sensitive values come from Railway environment variables.
# ================================================================

# Server
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# ----------------- Database (Railway/Render/Aiven compatible) -----------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD}}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=false

# Disable SQL init scripts in production (Hibernate DDL handles schema)
spring.sql.init.mode=never

# Disable SQL logging in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable H2 console (not applicable in prod, but ensure it's off)
spring.h2.console.enabled=false

# ----------------- SMTP Email (set via Railway env vars) -----------------
# Use Brevo SMTP: host=smtp-relay.brevo.com, port=587
# Set SMTP_HOST, SMTP_USER, SMTP_PASSWORD in Railway dashboard
spring.mail.host=${SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ----------------- App Config -----------------
# Base URL used for password reset links (set to your Railway domain)
app.base.url=${APP_BASE_URL:https://your-app.up.railway.app}
